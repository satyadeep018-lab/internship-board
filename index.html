<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Board</title>
  <meta name="description" content="Search and filter student internships by domain and work mode, then apply.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#results">Skip to internships</a>

  <header class="site-header">
    <div class="wrap">
      <h1>Internship Board</h1>
      <p>Find a student internship by skill, domain or work mode.</p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="filters-h">
      <h2 id="filters-h" class="sr">Search and filters</h2>
      <form id="filters" role="search" novalidate>
        <div class="field">
          <label for="q">Search title, skill or location</label>
          <input id="q" type="search" autocomplete="off">
        </div>
        <div class="field">
          <label for="domain">Domain</label>
          <select id="domain"><option value="">All domains</option></select>
        </div>
        <div class="field">
          <label for="mode">Work mode</label>
          <select id="mode"><option value="">All modes</option></select>
        </div>
        <button type="button" id="clear" class="btn secondary">Clear filters</button>
      </form>
    </section>

    <section aria-labelledby="results-h">
      <h2 id="results-h">Open internships</h2>
      <p id="count" role="status" aria-live="polite"></p>
      <div id="results" tabindex="-1">
        <div id="state"></div>
        <ul id="list" class="grid"></ul>
      </div>
      <noscript><p class="state error">This board needs JavaScript to load internships.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap"><p>Fictional internships for a practice project. Applications are stored in your browser only.</p></div>
  </footer>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="dlg-body">
      <div class="dlg-head">
        <h2 id="dlg-title"></h2>
        <button type="button" id="dlg-close" class="btn secondary">Close</button>
      </div>
      <dl id="dlg-details"></dl>
      <form id="apply" novalidate>
        <h3>Apply for this internship</h3>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" type="text" autocomplete="name" aria-describedby="name-err">
          <p class="err" id="name-err"></p>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" aria-describedby="email-err">
          <p class="err" id="email-err"></p>
        </div>
        <div class="field">
          <label for="url">Portfolio link (optional)</label>
          <input id="url" type="text" inputmode="url" autocomplete="url" placeholder="https://" aria-describedby="url-err">
          <p class="err" id="url-err"></p>
        </div>
        <div id="form-msg" class="msg" role="status" tabindex="-1"></div>
        <button type="submit" class="btn">Submit application</button>
      </form>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
